services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      # O Ollama roda na máquina (fora do Docker), para usar a GPU sem configuração extra
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: qwen2.5:7b
      EMBED_MODEL: nomic-embed-text
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dados:/app/dados
      - ./avaliacao:/app/avaliacao

volumes:
  pgdata:
